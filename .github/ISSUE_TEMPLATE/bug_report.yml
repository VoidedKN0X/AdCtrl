name: Bug report
description: Something in AdCtrl doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Before you post, please remove server addresses, passwords, push addresses, domains from your query log and other personal info from the text and screenshots below. This issue is public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: app-version
    attributes:
      label: AdCtrl version
      placeholder: "Profile picture > bottom of the You page, e.g. 0.12.3"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone
      placeholder: "Android 15, Pixel 8"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: AdGuard Home version
      placeholder: "v0.107.79"
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - GitHub Releases
        - Obtainium
        - CtrlF-Droid
        - Built it myself
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Drag images in here. Please remove anything personal first.
